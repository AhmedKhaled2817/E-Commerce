<div class="mega-menu" [class.show]="showMenu">
  @for(column of megaMenuData;  track column.title){
    <div class="menu-column">
      <h4>{{ column.title }}</h4>
      @for(item of column.items; track item){
        <a [routerLink]="['/public/products',item]">{{ item }}</a>
      }
    </div>
  }
  </div>
