@if(testimonials){
  <div class="comment-card h-100 d-flex flex-column">

  <!-- Stars -->
  <div class="mb-3">
    @for(star of [].constructor(testimonials.stars); track $index){
      <span class="stars">
        <i class="fa-solid fa-star"></i>
      </span>
    }
  </div>

  <!-- Comment text -->
  <p class="comment flex-grow-1">
    {{ testimonials.comments }}
  </p>

  <!-- User info -->
  <div class="d-flex align-items-center mt-3">
    <div class="user-image-wrapper">
      <img
        [src]="testimonials.img"
        [alt]="testimonials.name"
        class="user-image"
      />
    </div>

    <div class="ms-3">
      <div class="user-name fw-bold mb-0">{{ testimonials.name }}</div>
      <div class="user-position text-muted small">{{ testimonials.position }}</div>
    </div>
  </div>
</div>
}
