<div class="container mt-5 customer-comment-list">
  <!-- Title + Buttons -->
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
    <h1 class="fw-bold mb-0">{{ 'home.customer_comments.title' | translate }}</h1>

    <div class="navigation-btns d-flex align-items-center">
      <button class="nav-btn me-2" type="button" (click)="prevSlide()" aria-label="Previous slide">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <button class="nav-btn" type="button" (click)="nextSlide()" aria-label="Next slide">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <!-- Testimonials Slider -->
  <div class="mt-5">
    <swiper-container #swiperRef init="false">
      @for (test of testimonials; track test.name) {
        <swiper-slide>
          <app-customer-comment [comments]="test"></app-customer-comment>
        </swiper-slide>
      }
    </swiper-container>
  </div>
</div>
