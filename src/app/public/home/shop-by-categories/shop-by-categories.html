<div class="container categories-section mt-5">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
    <h1 class="fw-bold mb-0 shop-by-categories">Shop By Categories</h1>

    <div class="navigation-btns d-flex gap-2">
      <button class="btn nav-btn px-3" type="button" (click)="prevSlide()">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <button class="btn nav-btn px-3" type="button" (click)="nextSlide()">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <!-- Categories Slider -->
  <div class="mt-4">
    <swiper-container #swiperRef init="false">
      @for (cat of categoriesList; track cat.name) {
        <swiper-slide>
          <app-category-card [category]="cat" />
        </swiper-slide>
      }
    </swiper-container>
  </div>
</div>
